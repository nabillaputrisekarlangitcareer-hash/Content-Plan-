<style>
:root{--bg:#f6f5f2;--surface:#fff;--text:#1d1d1f;--muted:#6b6b72;--line:#e4e2dc;--accent:#4f46e5;--accent-soft:#eceafd;--nabilla:#db2777;--nabilla-bg:#fce7f1;--zyon:#0d9488;--zyon-bg:#d9f3ef;--ok:#15803d;--warn:#b45309;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--surface:#1e1e22;--text:#f0f0f2;--muted:#a0a0a8;--line:#2e2e34;--accent:#8b85ff;--accent-soft:#25234a;--nabilla:#f472b6;--nabilla-bg:#3a1a2b;--zyon:#2dd4bf;--zyon-bg:#12312d;--ok:#4ade80;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141416;--surface:#1e1e22;--text:#f0f0f2;--muted:#a0a0a8;--line:#2e2e34;--accent:#8b85ff;--accent-soft:#25234a;--nabilla:#f472b6;--nabilla-bg:#3a1a2b;--zyon:#2dd4bf;--zyon-bg:#12312d;--ok:#4ade80;--warn:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}
.chip.nabilla{background:var(--nabilla-bg);color:var(--nabilla)}
.chip.zyon{background:var(--zyon-bg);color:var(--zyon)}
.chip.mode{background:var(--accent-soft);color:var(--accent)}
.chip.ro{background:transparent;border-color:var(--line);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;-webkit-overflow-scrolling:touch}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:inherit;font-weight:600;padding:10px 14px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat .n{font-size:28px;font-weight:700;line-height:1.1}
.stat .l{color:var(--muted);font-size:13px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.soon{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700}
.note{margin-top:12px;font-size:13px;color:var(--muted)}
.err{margin-bottom:12px;padding:10px 14px;border-radius:10px;background:var(--nabilla-bg);color:var(--nabilla);font-size:13px;display:none}
.err.show{display:block}
section[hidden]{display:none}
h2{font-size:16px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar input,.bar select,#cp-dlg input,#cp-dlg select,#cp-dlg textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.bar input[type=search]{flex:1 1 180px}
.btn{font:inherit;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:0 0 250px;background:var(--accent-soft);border-radius:14px;padding:10px;min-height:120px}
.col h3{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.kc[draggable=true]{cursor:grab}
.kc .t{font-weight:600;margin-bottom:6px;word-break:break-word}
.kc .m{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
.kc select{width:100%;margin-bottom:6px;font-size:12px;padding:4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.acts{display:inline-flex;gap:4px;flex-wrap:wrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:12px}
td.j{white-space:normal;min-width:180px;font-weight:600}
#cp-dlg{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--text);width:min(560px,94vw);max-height:90vh;padding:16px}
#cp-dlg::backdrop{background:rgba(0,0,0,.5)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.fg .w{grid-column:1/-1}
.fg input,.fg select,.fg textarea{width:100%}
.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.ig{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ic .t{font-weight:600;margin-bottom:6px;word-break:break-word}
.ic .n{font-size:13px;color:var(--muted);margin:6px 0;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ic .m{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}
.ic a{font-size:13px;color:var(--accent);word-break:break-all}
.chip.tag{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:transparent;border-color:var(--line);color:var(--ok)}
#ip-dlg{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--text);width:min(560px,94vw);max-height:90vh;padding:16px}
#ip-dlg::backdrop{background:rgba(0,0,0,.5)}
#ip-dlg input,#ip-dlg select,#ip-dlg textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.cal{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:12px;align-items:start}
.ct{font-weight:700;flex:1 1 140px;align-self:center;text-align:center}
.cgw{overflow-x:auto}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cg.mo{min-width:600px}
.ch{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.dc{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:92px;padding:4px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.cg.wk .dc{min-height:220px}
.dc.oth{opacity:.55}
.dc.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dc.today .dn{background:var(--accent);color:#fff}
.dc.e{background:transparent;border-style:dashed}
.dn{font-size:12px;font-weight:700;align-self:flex-start;padding:1px 7px;border-radius:999px}
.plus{display:none;margin:auto;color:var(--muted);font-size:18px}
.dc.e:hover .plus{display:block}
.ev{background:var(--bg);border:1px solid var(--line);border-left:4px solid #6b7280;border-radius:6px;padding:3px 5px;cursor:pointer;min-width:0}
.ev[draggable=true]{cursor:grab}
.et{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.ev .chip{padding:0 6px;font-size:10px}
.side .ev{margin-bottom:6px}
.lg{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12px}
@media(max-width:760px){.cal{grid-template-columns:1fr}.cg.wk{grid-template-columns:1fr}.cg.wk .dc{min-height:60px}.cg.wk+.x{display:none}}
.orow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px;font:inherit;color:var(--text);cursor:pointer}
.sh{font-weight:700;margin:16px 0 6px}
.stn.warn .n{color:var(--warn)}
#st .card{margin-top:12px}
.lr{display:flex;gap:6px;margin-bottom:6px}
.lr input{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.bl{display:block;font-size:12px;color:var(--accent);margin-bottom:6px}
.chip.vira{background:var(--accent-soft);color:var(--accent)}
#bl-dlg{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--text);width:min(560px,94vw);max-height:90vh;padding:16px}
#bl-dlg::backdrop{background:rgba(0,0,0,.5)}
#bl-dlg input,#bl-dlg select,#bl-dlg textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
@media(max-width:480px){.fg{grid-template-columns:1fr}}

:root{--bg:#f3f0ff;--surface:#fff;--text:#2a2352;--muted:#6f69a0;--line:#e3ddfb;--accent:#6c4df6;--accent-soft:#ece7ff;--nabilla:#d6246e;--nabilla-bg:#ffd9ea;--zyon:#0a8f76;--zyon-bg:#c9f5e8;--ok:#0a8f76;--warn:#c2410c;

body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500}

.chip{font-weight:700}
.chip.nabilla{background:var(--t5);color:var(--t5x)}

.chip.tag{background:var(--t1);color:var(--t1x)}
nav{border-bottom:0;gap:6px;padding:2px 0 8px}
nav button{border:0;border-radius:999px;padding:8px 16px;font-weight:700;transition:background .15s,color .15s}
nav button:hover{background:var(--accent-soft);color:var(--accent)}
nav button[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:0 6px 14px -6px var(--accent)}
.card{border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
#stats .card{border:0}
#stats .card:nth-child(1){background:var(--t1)}#stats .card:nth-child(1) .n{color:var(--t1x)}
#stats .card:nth-child(2){background:var(--t2)}#stats .card:nth-child(2) .n{color:var(--t2x)}

#stats .card:nth-child(4){background:var(--t4)}#stats .card:nth-child(4) .n{color:var(--t4x)}
#stats .card:nth-child(5){background:var(--t5)}#stats .card:nth-child(5) .n{color:var(--t5x)}
.stat .n{font-size:32px;font-weight:800}

.btn{border-radius:12px;font-weight:700;transition:transform .12s,box-shadow .12s}

.bar input,.bar select,.lr input,#cp-dlg input,#cp-dlg select,#cp-dlg textarea,#ip-dlg input,#ip-dlg select,#ip-dlg textarea,#bl-dlg input,#bl-dlg select,#bl-dlg textarea{border-radius:12px;border:1.5px solid var(--line)}

<body>
<div class="wrap">
  <header>
    <div>
      <h1>Content Plan</h1>
      <div class="sub" id="today">&nbsp;</div>
    </div>
    <div class="chips">
      <span class="chip nabilla"><span class="dot"></span>Nabilla</span>
      <span class="chip zyon"><span class="dot"></span>Zyon</span>
      <span class="chip ro" id="status">Menghubungkan…</span>
    </div>
  </header>

      window.CP_CAN_EDIT=!!ok;blRender();cpRender();ipRender();calRender();renderSettings();
    }).catch(function(){});
    window.CP_DB=db;subSet(db);
    function sub(name,cb){
      try{
        db.collection(name).onSnapshot(function(snap){cb(snap);},function(){showErr("Gagal memuat data "+name+". Muat ulang halaman untuk mencoba lagi.");});
      }catch(e){showErr("Gagal memuat data "+name+".");}
    }
    sub("blog",function(s){blogDocs=s.docs.map(function(d){return Object.assign({id:d.id},d.data()||{});});renderStats();blRender();calRender();});
    sub("inspo",function(s){counts.inspo=s.size;inspoDocs=s.docs.map(function(d){return Object.assign({id:d.id},d.data()||{});});renderStats();ipRender();});
    sub("konten",function(s){counts.konten=s.size;kontenDocs=s.docs.map(function(d){var o=Object.assign({id:d.id},d.data()||{});o.status=({"Ide":"Idea","Siap Tayang":"Ready to Post","Terjadwal":"Scheduled","Tayang":"Posted"})[o.status]||o.status;return o;});renderStats();cpRender();calRender();});
  }).catch(function(){setStatus("Mode lokal");showErr("Penyimpanan data tidak dapat dimuat.");});
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){});});}</script>
